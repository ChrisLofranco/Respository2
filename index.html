<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Driving Simulator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="speedo">
        <div class="speed-value"><span id="speed">0</span><small>km/h</small></div>
        <div class="gear" id="gear">D</div>
      </div>
      <div class="pedals">
        <div class="pedal" id="pedal-throttle"><span>GAS</span></div>
        <div class="pedal" id="pedal-brake"><span>BRAKE</span></div>
      </div>
    </div>

    <!-- Lap timer -->
    <div id="laps">
      <div class="lap-main">
        <span class="lap-label">LAP</span>
        <span id="lap-time">0.00</span>
      </div>
      <div class="lap-sub">
        <span>Best <b id="best-time">--</b></span>
        <span>Laps <b id="lap-count">0</b></span>
      </div>
    </div>

    <!-- Minimap -->
    <div id="minimap-wrap">
      <canvas id="minimap"></canvas>
    </div>

    <!-- Car color picker -->
    <div id="colors" title="Car colour">
      <button class="swatch active" data-color="#e94b3c" style="background:#e94b3c"></button>
      <button class="swatch" data-color="#3c78e9" style="background:#3c78e9"></button>
      <button class="swatch" data-color="#2fb463" style="background:#2fb463"></button>
      <button class="swatch" data-color="#e9b53c" style="background:#e9b53c"></button>
      <button class="swatch" data-color="#e97f3c" style="background:#e97f3c"></button>
      <button class="swatch" data-color="#8b5ee9" style="background:#8b5ee9"></button>
      <button class="swatch" data-color="#2fb4a8" style="background:#2fb4a8"></button>
      <button class="swatch" data-color="#eef1f5" style="background:#eef1f5"></button>
      <button class="swatch" data-color="#2b2f36" style="background:#2b2f36"></button>
    </div>

    <!-- Mute -->
    <button id="mute-toggle" title="Mute / unmute">🔊</button>

    <!-- Controls hint -->
    <div id="help">
      <div class="help-title">Driving Simulator</div>
      <div class="help-keys">
        <span><b>W</b> / <b>↑</b> Accelerate</span>
        <span><b>S</b> / <b>↓</b> Brake / Reverse</span>
        <span><b>A</b> <b>D</b> / <b>← →</b> Steer</span>
        <span><b>Space</b> Handbrake</span>
        <span><b>H</b> Horn</span>
        <span><b>C</b> Camera</span>
        <span><b>M</b> Mute</span>
        <span class="help-tip">Drive through the glowing gates for a lap time!</span>
      </div>
    </div>

    <button id="help-toggle" title="Toggle help">?</button>

    <!-- Touch controls -->
    <div id="touch">
      <div class="touch-steer">
        <button class="tbtn" data-key="left">◀</button>
        <button class="tbtn" data-key="right">▶</button>
      </div>
      <div class="touch-drive">
        <button class="tbtn tbtn-brake" data-key="down">▼</button>
        <button class="tbtn tbtn-gas" data-key="up">▲</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
